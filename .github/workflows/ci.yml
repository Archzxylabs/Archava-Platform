name: CI

# The gates a PR must clear before review, in the order they fail fastest.
#
# The platform job mirrors `pnpm verify`. The standalone npm template has its
# own job so neither project's checks can silently omit the other's source.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the run it replaces, so a PR's status reflects its
  # latest commit rather than the queue behind it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .tool-versions
        run: echo "NODE_VERSION=$(grep '^node ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before anything that compiles. This one costs a second and catches a
      # class of breakage the other gates structurally cannot see: vitest's
      # alias table resolves an undeclared neighbour as happily as a declared
      # one, so a missing workspace dependency passes `pnpm test` and fails
      # later, somewhere with less context.
      - name: Structure
        run: pnpm structure

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Archava Template
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .tool-versions
        working-directory: .
        run: echo "NODE_VERSION=$(grep '^node ' .tool-versions | awk '{print $2}')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Archava Template/package-lock.json

      - name: Install template
        run: npm ci

      - name: Test template
        run: npm test

      - name: Test offline agent guardrails
        run: npm run test:agent

      - name: Build template
        run: npm run build
