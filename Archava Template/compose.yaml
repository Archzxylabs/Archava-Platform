services:
  api:
    build: .
    env_file: .env
    environment:
      RUN_MODE: api
      PORT: "5002"
    ports:
      - "${PORT:-5002}:5002"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
  worker:
    build: .
    env_file: .env
    environment:
      RUN_MODE: worker
    restart: unless-stopped
    init: true
