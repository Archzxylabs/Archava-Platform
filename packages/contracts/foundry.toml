[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
cache_path = "cache"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
    "ds-test/=lib/forge-std/lib/ds-test/src/"
]

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
