<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archava — studio</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 52rem;
        padding: 2rem 1.25rem 4rem;
        line-height: 1.55;
      }
      header {
        border-bottom: 1px solid currentColor;
        margin-bottom: 1.5rem;
        padding-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.25rem;
      }
      p.lede {
        margin: 0;
        opacity: 0.75;
      }
      nav {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
        margin-top: 0.75rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 1rem 0 0.35rem;
      }
      textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        min-height: 20rem;
        width: 100%;
      }
      input[type='text'] {
        padding: 0.4rem;
        width: min(24rem, 100%);
      }
      button {
        font: inherit;
        margin-top: 1rem;
        padding: 0.4rem 1.2rem;
      }
      #studio-result {
        border-top: 1px solid currentColor;
        margin-top: 1.5rem;
        padding-top: 0.75rem;
      }
      #studio-result ul {
        margin: 0;
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Studio</h1>
      <p class="lede">
        Answers in, three priced variants out (§14.1), with the reason for the selection.
      </p>
      <nav>
        <a href="/">Page</a>
        <a href="/studio">Studio</a>
      </nav>
    </header>

    <main>
      <p>
        The intake is the tenant's onboarding answers. Send it and the server prices the
        recommended, budget, and premium variants from the same pricebook, then says which one it
        selected and why.
      </p>

      <form id="studio-intake">
        <label for="studio-intake-json">Intake</label>
        <!-- The CLI's own example intake. Pre-filled so the studio does something
             the first time it is opened, and so an invalid first attempt is a
             deliberate edit rather than a typo. -->
        <textarea id="studio-intake-json" name="intake" spellcheck="false">
{
  "clientId": "klinik-nusantara",
  "clientName": "Klinik Nusantara",
  "industry": "clinic",
  "region": "ID",
  "existingWebsite": {
    "url": "https://kliniknusantara.example",
    "status": "stale"
  },
  "businessGoals": [
    "Cut phone-tag booking",
    "Answer clinic hours and pricing questions without a receptionist"
  ],
  "presence": "chat",
  "actionsRequired": ["booking.create", "booking.reschedule", "booking.cancel"],
  "transactionMode": "booking",
  "expectedConversationsPerMonth": 900,
  "languages": [
    { "code": "id", "label": "Bahasa Indonesia" },
    { "code": "en", "label": "English" }
  ],
  "primaryLanguage": "id",
  "integrations": [
    { "name": "Google Calendar", "complexity": "standard", "required": true },
    { "name": "Midtrans", "complexity": "advanced", "required": false }
  ],
  "brandAssets": { "logo": true, "styleGuide": false, "photography": true },
  "compliance": ["gdpr", "hipaa"],
  "customDesign": [],
  "support": "standard",
  "annualPrepay": false,
  "targetLaunchDate": "2026-11-02",
  "budget": { "amount": 45000000, "currency": "IDR" }
}</textarea
        >

        <!-- The one thing emitClientConfig will not derive. Everything else about
             the emitted config comes from the scope the intake describes. -->
        <label for="studio-brand-name">Business name in the emitted config (optional)</label>
        <input id="studio-brand-name" name="brandName" type="text" placeholder="Klinik Nusantara" />

        <button type="submit">Price it</button>
      </form>

      <!-- The route's answer lands here: the selection, its reason, the three
           variants at their own prices, and a line if a config was emitted. -->
      <div id="studio-result" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="/studio.js"></script>
  </body>
</html>
