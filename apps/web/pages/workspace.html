<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Archava Workspace — Frontend demo</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/archava.css" />
    <link rel="stylesheet" href="/workspace.css" />
    <script type="module" src="/workspace.js"></script>
  </head>
  <body class="workspace-page" data-theme="light">
    <a href="#workspace-view" class="skip-link">Skip to workspace</a>
    <div class="workspace-shell">
      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
      <aside class="workspace-sidebar" id="workspace-sidebar" aria-label="Workspace navigation">
        <div class="sidebar-brand">
          <a class="brand" href="/archava"
            ><img src="/assets/mark.svg" width="30" height="30" alt="" /><span>archava.</span></a
          ><button
            class="icon-button sidebar-close"
            id="sidebar-close"
            aria-label="Close navigation"
          >
            ×
          </button>
        </div>
        <label class="workspace-picker"
          ><span class="company-badge" id="company-badge">N</span
          ><span
            ><span class="sr-only">Sample industry workspace</span
            ><select id="industry-select">
              <option value="studio">North Studio</option>
              <option value="healthcare">Care Clinic</option>
              <option value="hospitality">Palm House</option>
              <option value="retail">Lokal Goods</option></select
            ><small id="industry-caption">Studio & services · Demo</small></span
          ><span aria-hidden="true">⌄</span></label
        >
        <div class="module-switch" aria-label="Workspace modules">
          <button data-module="crm" class="active" aria-pressed="true">CRM</button
          ><button data-module="erp" aria-pressed="false">Operations</button>
        </div>
        <nav id="workspace-nav" aria-label="Main workspace"></nav>
        <div class="sidebar-bottom">
          <a href="/archava"><span aria-hidden="true">↗</span> Back to the website</a>
          <div class="sidebar-demo-note">
            <span class="signal-dot"></span
            ><span>Demo workspace<small>Sample data · saved on this device</small></span>
          </div>
          <button class="sidebar-profile" id="workspace-settings">
            <span class="user-avatar">AK</span><span>Alex Kim<small>Workspace owner</small></span
            ><span aria-hidden="true">⌘</span>
          </button>
        </div>
      </aside>
      <div class="workspace-main">
        <header class="workspace-topbar">
          <div class="topbar-left">
            <button
              class="icon-button"
              id="sidebar-open"
              aria-controls="workspace-sidebar"
              aria-expanded="false"
              aria-label="Open navigation"
            >
              <svg
                viewBox="0 0 24 24"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg></button
            ><span id="breadcrumb">Workspace <i>/</i> Overview</span>
          </div>
          <div class="topbar-tools">
            <button class="command-trigger" id="command-trigger">
              <svg
                viewBox="0 0 24 24"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <circle cx="10" cy="10" r="6" />
                <path d="m15 15 5 5" /></svg
              ><span>Search workspace</span><kbd>⌘ K</kbd></button
            ><button
              class="icon-button"
              id="theme-toggle"
              aria-label="Switch to dark theme"
            ></button
            ><span class="topbar-avatar">AK</span>
          </div>
        </header>
        <main id="workspace-view" tabindex="-1">
          <div class="workspace-loading">Preparing your demo workspace…</div>
          <noscript
            ><p>
              This interactive frontend needs JavaScript. <a href="/archava">Visit the website</a>.
            </p></noscript
          >
        </main>
        <footer class="workspace-footer">
          <span><span class="signal-dot"></span> FRONTEND DEMO · FICTIONAL DATA</span
          ><button id="reset-demo">Reset this demo</button>
        </footer>
      </div>
    </div>
    <dialog class="workspace-dialog" id="workspace-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <dialog class="command-dialog" id="command-dialog" aria-label="Search the demo workspace">
      <div class="command-input-row">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <circle cx="10" cy="10" r="6" />
          <path d="m15 15 5 5" /></svg
        ><label class="sr-only" for="command-input">Search records and pages</label
        ><input
          id="command-input"
          placeholder="Search leads, orders, or pages…"
          autocomplete="off"
        /><button class="icon-button" id="command-close" aria-label="Close search">×</button>
      </div>
      <div id="command-results"></div>
      <p class="command-footer">Search sample records · Escape to close</p>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
